<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users · Nidhi Kavach</title>
  <meta name="description" content="Manage portal users: AICTE staff, institution and bank accounts, roles and access">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script src="../assets/js/config.js"></script>
  <style>
    .us-filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 14px 18px; border-bottom: 1px solid var(--nk-border); background: var(--nk-surface-2); }
    .us-filters .field { min-width: 170px; }
    .us-filters .field.grow { flex: 1 1 240px; }
    .us-user { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .us-user .avatar.off { background: var(--nk-slate-50); color: var(--nk-muted); }
    .us-user .u-txt { min-width: 0; }
    .us-user .cell-sub { overflow-wrap: normal; }
    tr.us-inactive td { color: var(--nk-muted); }
    tr.us-inactive .cell-main { text-decoration: line-through; text-decoration-color: var(--nk-border-strong); }
    .us-switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .82rem; color: var(--nk-text-2); white-space: nowrap; }
    .us-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .us-switch .track { width: 38px; height: 22px; border-radius: 999px; background: var(--nk-border-strong); position: relative; transition: background .15s; flex: none; }
    .us-switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--nk-surface); box-shadow: var(--nk-shadow-1); transition: transform .15s; }
    .us-switch input:checked + .track { background: var(--nk-success); }
    .us-switch input:checked + .track::after { transform: translateX(16px); }
    .us-switch input:focus-visible + .track { box-shadow: var(--nk-focus); }
    .us-switch input:disabled + .track { opacity: .5; }
    .us-switch input:disabled ~ span { opacity: .7; }
    .us-roles .card-body { display: flex; flex-direction: column; gap: 8px; }
    .us-roles .r-head { display: flex; align-items: center; gap: 10px; }
    .us-roles .r-head .feature-icon { width: 38px; height: 38px; flex: none; }
    .us-roles .r-head > div { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; min-width: 0; }
    .us-roles ul { margin: 0; padding-left: 18px; color: var(--nk-text-2); font-size: .86rem; display: grid; gap: 4px; }
    .us-form .alert { margin-bottom: 14px; }
    .us-form .field.hidden { display: none; }
    .us-form .input[readonly] { background: var(--nk-surface-2); color: var(--nk-text-2); cursor: not-allowed; }
    .us-count { color: var(--nk-muted); font-size: .86rem; }
    @media (max-width: 640px) {
      .us-filters { padding: 12px; }
      .us-filters .field { min-width: 0; flex: 1 1 100%; }
      .us-roles.grid { grid-template-columns: 1fr; }
      .section-title { flex-wrap: wrap; }
    }
  </style>
</head>
<body data-page="admin-users">
  <header id="nk-header"></header>
  <div id="nk-pagehead"></div>
  <main id="main" class="nk-main">
    <div class="nk-container stack lg">
      <section aria-labelledby="us-kpi-h">
        <h2 class="sr-only" id="us-kpi-h" data-i18n="users.kpi_h">User summary</h2>
        <div class="grid g-5" id="kpis"></div>
      </section>

      <section class="card" aria-labelledby="us-list-h">
        <div class="card-head">
          <h3 id="us-list-h"><span data-icon="users"></span> <span data-i18n="users.list_h">Portal users</span></h3>
          <span class="us-count" id="count"></span>
        </div>
        <div class="us-filters" role="search">
          <div class="field">
            <label for="f-role" data-i18n="users.f_role">Role</label>
            <select class="select" id="f-role"></select>
          </div>
          <div class="field">
            <label for="f-status" data-i18n="users.f_status">Account status</label>
            <select class="select" id="f-status"></select>
          </div>
          <div class="field grow">
            <label for="f-q" data-i18n="common.search">Search</label>
            <div class="input-icon"><span data-icon="search"></span><input class="input" id="f-q" type="search" data-i18n-placeholder="users.f_search" placeholder="Name, email, organisation or designation"></div>
          </div>
          <button class="btn ghost" type="button" id="f-clear"><span data-icon="x"></span> <span data-i18n="users.clear">Clear filters</span></button>
        </div>
        <div class="card-body flush" id="table"></div>
        <div id="pager"></div>
      </section>

      <section aria-labelledby="us-roles-h">
        <div class="section-title">
          <h2 id="us-roles-h" data-i18n="users.roles_h">Role-based access</h2>
          <span class="muted small" data-i18n="users.roles_sub">Each account sees only what its role allows. Every change here is written to the audit trail.</span>
        </div>
        <div class="grid g-5 us-roles" id="roles"></div>
      </section>
    </div>
  </main>
  <div id="nk-footer"></div>
  <script type="module" src="users.js"></script>
</body>
</html>
