<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerts &amp; reminders · Nidhi Kavach</title>
  <meta name="description" content="Alerts centre: escalation ladder, simulated email / SMS / in-app outbox, reminder rules and the daily job">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script src="../assets/js/config.js"></script>
  <style>
    /* escalation ladder (horizontal on desktop, vertical on phones) */
    .ladder-phases { display: flex; gap: 10px; margin-bottom: 10px; }
    .ladder-phases .ph { flex: var(--n, 1); min-width: 0; border-radius: var(--nk-radius-sm); padding: 6px 10px; font-size: .78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
    .ladder-phases .ph.pre { background: var(--nk-primary-50); color: var(--nk-primary-700); }
    .ladder-phases .ph.mat { background: var(--nk-saffron-50); color: var(--nk-saffron-600); justify-content: center; }
    .ladder-phases .ph.post { background: var(--nk-danger-50); color: var(--nk-danger); }
    .ladder { display: flex; align-items: flex-start; position: relative; padding: 4px 0 2px; }
    .ladder .lnode { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; padding: 0 6px; }
    .ladder .lnode::before { content: ""; position: absolute; top: 22px; left: -50%; right: 50%; height: 3px; background: var(--nk-primary-100); z-index: 0; }
    .ladder .lnode:first-child::before { display: none; }
    .ladder .lnode.post::before, .ladder .lnode.mat + .lnode::before { background: var(--nk-danger-50); }
    .ladder .lnode.post::before { background: var(--nk-danger); opacity: .35; }
    .ladder .lcircle { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--nk-surface);
      border: 3px solid var(--nk-primary); color: var(--nk-primary); position: relative; z-index: 1; flex: none; }
    .ladder .lnode.warn .lcircle { border-color: var(--nk-warning-bd); color: var(--nk-warning); background: var(--nk-warning-50); }
    .ladder .lnode.crit .lcircle { border-color: var(--nk-orange); color: var(--nk-orange); background: var(--nk-orange-50); }
    .ladder .lnode.mat .lcircle { border-color: var(--nk-saffron); background: var(--nk-saffron); color: var(--nk-surface); }
    .ladder .lnode.post .lcircle { border-color: var(--nk-danger); color: var(--nk-danger); background: var(--nk-danger-50); }
    .ladder .lnode.post.l2 .lcircle { background: var(--nk-danger); color: var(--nk-surface); }
    .ladder .lnode.off .lcircle { border-color: var(--nk-border-strong); color: var(--nk-muted); background: var(--nk-slate-50); }
    .ladder .ltext { margin-top: 8px; min-width: 0; }
    .ladder .lday { font-weight: 700; font-size: .9rem; color: var(--nk-text); }
    .ladder .lwho { font-size: .8rem; color: var(--nk-text-2); margin-top: 2px; }
    .ladder .lch { display: flex; gap: 4px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
    .ladder .lch .chi { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--nk-slate-50); color: var(--nk-slate); border: 1px solid var(--nk-border); }
    .ladder .lnode.off .ltext { opacity: .6; }
    .ladder-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--nk-muted); margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--nk-border); }
    .ladder-legend span { display: inline-flex; align-items: center; gap: 6px; }
    @media (max-width: 760px) {
      .ladder-phases { display: none; }
      .ladder { flex-direction: column; }
      .ladder .lnode { flex-direction: row; align-items: flex-start; text-align: left; gap: 12px; padding: 0 0 14px; width: 100%; }
      .ladder .lnode::before, .ladder .lnode:first-child::before { display: block; left: 21px; right: auto; width: 3px; height: auto; top: 0; bottom: 0; }
      .ladder .lnode:first-child::before { top: 23px; }
      .ladder .lnode:last-child::before { bottom: auto; height: 23px; }
      .ladder .ltext { margin-top: 2px; }
      .ladder .lch { justify-content: flex-start; }
    }
    #tabs > .tabs { padding: 4px 12px 0; }
    #tabs > .tab-panel { padding-top: 0; }
    .panel-pad { padding: 16px 18px; }
    /* outbox */
    .ob-filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px 18px; border-bottom: 1px solid var(--nk-border); background: var(--nk-surface-2); }
    .ob-filters .field { min-width: 170px; }
    .ob-filters .field.grow { flex: 1 1 220px; }
    .ob-subject { font-weight: 600; color: var(--nk-text); max-width: 420px; }
    .msg-email { border: 1px solid var(--nk-border); border-radius: var(--nk-radius); overflow: hidden; }
    .msg-email .me-head { background: var(--nk-surface-2); border-bottom: 1px solid var(--nk-border); padding: 10px 14px; font-size: .85rem; display: grid; gap: 3px; }
    .msg-email .me-head b { color: var(--nk-text-2); display: inline-block; min-width: 64px; font-weight: 600; }
    .msg-email .me-body { padding: 14px; white-space: pre-wrap; line-height: 1.6; }
    .msg-email .me-foot { padding: 8px 14px; font-size: .78rem; color: var(--nk-muted); border-top: 1px dashed var(--nk-border); }
    .msg-sms { background: var(--nk-slate-50); border: 1px solid var(--nk-border); border-radius: var(--nk-radius); padding: 14px; }
    .msg-sms .bubble { background: var(--nk-primary-50); border: 1px solid var(--nk-primary-100); border-radius: 16px 16px 16px 4px; padding: 10px 14px; max-width: 460px; line-height: 1.5; }
    .msg-sms .sender { font-size: .78rem; font-weight: 700; color: var(--nk-primary-700); margin-bottom: 6px; letter-spacing: .04em; }
    .msg-app { border: 1px solid var(--nk-border); border-radius: var(--nk-radius); }
    /* rules */
    .rule-days { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .rule-days .input { width: 78px; text-align: right; }
    .chan-picks { display: flex; gap: 6px; flex-wrap: wrap; }
    .chan-pick { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--nk-border-strong); border-radius: 999px; padding: 3px 10px 3px 6px; font-size: .8rem; cursor: pointer; background: var(--nk-surface); color: var(--nk-text-2); user-select: none; }
    .chan-pick input { width: 15px; height: 15px; accent-color: var(--nk-primary); margin: 0; }
    .chan-pick.on { background: var(--nk-primary-50); border-color: var(--nk-primary); color: var(--nk-primary-700); }
    .chan-pick.disabled { cursor: default; opacity: .8; }
    .ops-switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .82rem; color: var(--nk-text-2); }
    .ops-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .ops-switch .track { width: 38px; height: 22px; border-radius: 999px; background: var(--nk-border-strong); position: relative; transition: background .15s; flex: none; }
    .ops-switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--nk-surface); box-shadow: var(--nk-shadow-1); transition: transform .15s; }
    .ops-switch input:checked + .track { background: var(--nk-success); }
    .ops-switch input:checked + .track::after { transform: translateX(16px); }
    .ops-switch input:focus-visible + .track { box-shadow: var(--nk-focus); }
    .ops-switch input:disabled + .track { opacity: .55; }
    tr.dirty td { background: var(--nk-warning-50); }
    /* daily job */
    .job-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .job-stat { border: 1px solid var(--nk-border); border-radius: var(--nk-radius); padding: 12px 14px; background: var(--nk-surface); }
    .job-stat .v { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--nk-text); line-height: 1.2; }
    .job-stat .l { font-size: .8rem; color: var(--nk-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .job-stat.hl { border-color: var(--nk-primary-100); background: var(--nk-primary-50); }
    .job-steps { counter-reset: js; list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .job-steps li { display: flex; gap: 12px; align-items: flex-start; font-size: .9rem; }
    .job-steps li::before { counter-increment: js; content: counter(js); width: 26px; height: 26px; border-radius: 50%; background: var(--nk-primary-50); color: var(--nk-primary); font-weight: 700; font-size: .82rem; display: grid; place-items: center; flex: none; }
    @media (max-width: 900px) { .job-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body data-page="officer-alerts">
  <header id="nk-header"></header>
  <div id="nk-pagehead"></div>
  <main id="main" class="nk-main">
    <div class="nk-container stack lg">
      <section aria-labelledby="kpi-h">
        <h2 id="kpi-h" class="sr-only" data-i18n="al.kpi_h">Message counts</h2>
        <div class="grid g-5" id="kpis"><div class="skeleton" style="height:96px"></div><div class="skeleton" style="height:96px"></div><div class="skeleton" style="height:96px"></div><div class="skeleton" style="height:96px"></div><div class="skeleton" style="height:96px"></div></div>
      </section>

      <section class="card accent-saffron" aria-labelledby="ladder-h">
        <div class="card-head">
          <h2 id="ladder-h"><span id="ladder-ic"></span><span data-i18n="al.ladder_title">Escalation ladder</span></h2>
          <span class="sub" data-i18n="al.ladder_sub">How the portal chases a deposit before and after it matures</span>
        </div>
        <div class="card-body" id="ladder"></div>
      </section>

      <section class="card" aria-label="Alerts centre">
        <div id="tabs"></div>
      </section>
    </div>
  </main>
  <div id="nk-footer"></div>
  <script type="module" src="alerts.js"></script>
</body>
</html>
