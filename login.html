<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Nidhi Kavach</title>
  <meta name="description" content="Sign in to Nidhi Kavach, the security deposit and FDR management portal, with your account or a demo account">
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="assets/js/config.js"></script>
  <style>
    .lg-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
    .lg-brand { padding: 30px 30px 26px; display: flex; flex-direction: column; gap: 20px; }
    .lg-brand > * { position: relative; z-index: 1; }
    .lg-brand .b-top { display: flex; align-items: center; gap: 16px; }
    .lg-brand .b-logo { width: 72px; height: 72px; border-radius: 18px; background: var(--nk-surface); display: grid; place-items: center; box-shadow: var(--nk-shadow-2); flex: none; }
    .lg-brand .b-name { font-size: 1.5rem; font-weight: 800; line-height: 1.15; }
    .lg-brand .b-name-hi { color: var(--nk-saffron); font-weight: 700; }
    .lg-brand .b-tag { opacity: .88; font-size: .9rem; }
    .lg-brand h2 { color: var(--nk-surface); font-size: 1.05rem; margin: 0 0 10px; }
    .lg-can { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .lg-can li { display: flex; gap: 12px; align-items: flex-start; }
    .lg-can .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--nk-surface) 14%, transparent); }
    .lg-can .r { font-weight: 700; font-size: .92rem; }
    .lg-can .d { opacity: .86; font-size: .86rem; }
    .lg-secure { margin-top: auto; display: flex; gap: 12px; align-items: flex-start; border: 1px solid color-mix(in srgb, var(--nk-surface) 24%, transparent); background: color-mix(in srgb, var(--nk-surface) 9%, transparent); border-radius: 12px; padding: 12px 14px; font-size: .88rem; }
    .lg-secure .icon { color: var(--nk-saffron); flex: none; margin-top: 2px; }
    .lg-secure b { display: block; margin-bottom: 2px; }
    .lg-form .card-body { padding: 26px 28px; }
    .lg-form h2 { margin: 0 0 4px; font-size: 1.3rem; color: var(--nk-navy); }
    .lg-form .intro { color: var(--nk-text-2); margin: 0 0 20px; }
    .lg-fields { display: grid; gap: 16px; }
    .lg-pw .input-group .btn { min-width: 92px; }
    .lg-form .input-icon input.input { padding-left: 38px; } /* theme's input[type=email].input outranks .input-icon .input */
    .lg-form .input-group .input { flex: 1; min-width: 0; }
    .lg-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .86rem; }
    .lg-form .alert { margin-bottom: 16px; }
    .lg-or { display: flex; align-items: center; gap: 12px; color: var(--nk-muted); font-size: .82rem; margin: 20px 0 14px; }
    .lg-or::before, .lg-or::after { content: ""; flex: 1; height: 1px; background: var(--nk-border); }
    .lg-me { display: flex; gap: 14px; align-items: center; padding: 16px; border: 1px solid var(--nk-border); border-radius: var(--nk-radius); background: var(--nk-surface-2); margin-bottom: 18px; }
    .lg-me .n { font-weight: 700; font-size: 1.05rem; }
    .lg-me .s { color: var(--nk-muted); font-size: .86rem; }
    .lg-me-actions { display: grid; gap: 10px; }

    .lg-demo { margin-top: 24px; }
    .lg-demo .card-head { flex-wrap: wrap; gap: 10px; }
    .lg-demo-cols { columns: 2 380px; column-gap: 20px; padding: 20px; }
    .lg-group { break-inside: avoid; border: 1px solid var(--nk-border); border-radius: var(--nk-radius); margin-bottom: 20px; background: var(--nk-surface); display: inline-block; width: 100%; overflow: hidden; }
    .lg-group-head { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--nk-surface-2); border-bottom: 1px solid var(--nk-border); }
    .lg-group-head .feature-icon { width: 38px; height: 38px; border-radius: 10px; }
    .lg-group-head h3 { margin: 0; font-size: 1rem; }
    .lg-group-head .gd { color: var(--nk-muted); font-size: .82rem; }
    .lg-acct { align-items: center; }
    .lg-acct + .lg-acct { border-top: 1px solid var(--nk-border); }
    .lg-acct .li-sub { overflow-wrap: anywhere; }
    .lg-acct .mono { font-size: .76rem; color: var(--nk-muted); overflow-wrap: anywhere; }
    @media (max-width: 900px) {
      .lg-grid { grid-template-columns: minmax(0, 1fr); }
      .lg-form { order: -1; }
    }
    @media (max-width: 640px) {
      .lg-brand { padding: 22px 18px; }
      .lg-form .card-body { padding: 20px 16px; }
      .lg-demo-cols { padding: 14px; columns: 1; }
      .lg-acct { flex-wrap: wrap; }
      .lg-acct .li-main { flex: 1 1 calc(100% - 60px); }
      .lg-acct .btn { margin-left: 46px; }
    }
  </style>
</head>
<body data-page="login">
  <header id="nk-header"></header>
  <div id="nk-pagehead"></div>
  <main id="main" class="nk-main">
    <div class="nk-container">
      <div class="lg-grid">
        <section class="hero-figure lg-brand" id="brand" aria-label="Nidhi Kavach"></section>
        <section class="card lg-form" aria-labelledby="form-title">
          <div class="card-body" id="form-area"></div>
        </section>
      </div>
      <section class="card lg-demo" id="demo" aria-labelledby="demo-title">
        <div class="card-head">
          <div>
            <h3 id="demo-title"><span data-i18n="login.demo_title">Demo accounts</span></h3>
            <div class="sub" id="demo-sub"></div>
          </div>
          <span class="badge b-saffron" id="demo-pw"></span>
        </div>
        <div id="demo-list"></div>
      </section>
    </div>
  </main>
  <div id="nk-footer"></div>
  <script type="module" src="login.js"></script>
</body>
</html>
