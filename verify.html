<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify an FDR receipt or release order · Nidhi Kavach</title>
  <meta name="description" content="Check that a bank-signed FDR receipt or a portal-signed release order (NOC) is genuine - scan its QR code, upload the document, paste the code or check a reference number.">
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="assets/js/config.js"></script>
  <script src="assets/vendor/jsQR.js"></script>
  <style>
    .vf-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 24px; align-items: start; }
    .vf-tool .card-body { padding-top: 6px; }
    .vf-tool .tab-panel { padding-top: 18px; }
    .vf-tool .card-body { padding-top: 16px; }
    .vf-tool .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; border-bottom: 0; overflow: visible; }
    .vf-tool .tabs button { flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; white-space: normal; gap: 6px; padding: 12px 8px; line-height: 1.25; font-size: .84rem;
      border: 1px solid var(--nk-border); border-radius: var(--nk-radius-sm); background: var(--nk-surface-2); color: var(--nk-text-2); }
    .vf-tool .tabs button:hover { border-color: var(--nk-primary-100); background: var(--nk-primary-50); }
    .vf-tool .tabs button.active { background: var(--nk-primary-50); border-color: var(--nk-primary); color: var(--nk-primary); box-shadow: inset 0 -3px 0 var(--nk-primary); }
    .vf-tool .tabs button:focus-visible { outline: 3px solid var(--nk-focus); outline-offset: 2px; }
    .vf-lead { color: var(--nk-text-2); margin: 0 0 14px; font-size: .94rem; }

    /* camera */
    .vf-cam { position: relative; aspect-ratio: 4 / 3; background: var(--nk-navy); border-radius: var(--nk-radius); overflow: hidden; display: grid; place-items: center; color: var(--nk-surface); }
    .vf-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .vf-cam .frame { position: absolute; inset: 16% 22%; border: 3px solid var(--nk-saffron); border-radius: 16px; box-shadow: 0 0 0 2000px color-mix(in srgb, var(--nk-navy) 40%, transparent); pointer-events: none; }
    .vf-cam .frame::after { content: ""; position: absolute; left: 8%; right: 8%; top: 12%; height: 2px; background: var(--nk-saffron); box-shadow: 0 0 10px var(--nk-saffron); animation: vf-scan 2s ease-in-out infinite alternate; }
    @keyframes vf-scan { to { top: 86%; } }
    @media (prefers-reduced-motion: reduce) { .vf-cam .frame::after { animation: none; top: 50%; } }
    .vf-cam .idle { position: relative; text-align: center; padding: 24px; max-width: 360px; }
    .vf-cam .idle .ring { width: 68px; height: 68px; border-radius: 50%; display: inline-grid; place-items: center; background: color-mix(in srgb, var(--nk-surface) 12%, transparent); margin-bottom: 12px; color: var(--nk-saffron); }
    .vf-cam .idle p { opacity: .88; margin: 6px 0 0; font-size: .9rem; }
    .vf-status { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; color: var(--nk-text-2); font-size: .9rem; min-height: 22px; }
    .vf-status .icon { flex: none; margin-top: 2px; }
    .vf-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }

    /* upload */
    .vf-tool .dropzone { padding: 34px 20px; }
    .vf-tool .dropzone:focus-visible { outline: 3px solid var(--nk-focus); outline-offset: 2px; }
    .vf-tool .dropzone strong { color: var(--nk-text); }
    .vf-file { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--nk-border); border-radius: var(--nk-radius-sm); margin-top: 14px; background: var(--nk-surface-2); flex-wrap: wrap; }
    .vf-file .li-icon { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--nk-primary-50); color: var(--nk-primary); flex: none; }
    .vf-file .nm { font-weight: 600; overflow-wrap: anywhere; }
    .vf-file .grow { min-width: 0; flex: 1; }
    .vf-tips { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; font-size: .86rem; color: var(--nk-text-2); }
    .vf-tips li { display: flex; gap: 8px; align-items: flex-start; }
    .vf-tips .icon { color: var(--nk-success); flex: none; margin-top: 2px; }
    .vf-tool textarea.textarea { font-family: var(--nk-mono); font-size: .82rem; min-height: 130px; word-break: break-all; }
    .vf-tool .ref-input { font-family: var(--nk-mono); text-transform: uppercase; letter-spacing: .02em; }

    /* result */
    .vf-placeholder { padding: 26px; }
    .vf-placeholder .ph-head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
    .vf-placeholder .ph-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--nk-primary-50); color: var(--nk-primary); flex: none; }
    .vf-placeholder h3 { margin: 0; font-size: 1.1rem; }
    .vf-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    .vf-checks li { display: flex; gap: 12px; align-items: flex-start; }
    .vf-checks .feature-icon { width: 38px; height: 38px; border-radius: 10px; }
    .vf-checks .t { font-weight: 600; }
    .vf-checks .d { color: var(--nk-text-2); font-size: .88rem; }
    .verify-result { background-clip: padding-box; }
    .verify-result .vr-head { align-items: flex-start; }
    .vr-title { margin: 0; font-size: 1.2rem; line-height: 1.3; }
    .verify-result.valid .vr-title { color: var(--nk-success); }
    .verify-result.invalid .vr-title { color: var(--nk-danger); }
    .vr-sub { color: var(--nk-text-2); font-size: .9rem; margin-top: 4px; overflow-wrap: anywhere; }
    .vr-sec { margin-top: 18px; }
    .vr-sec > h4 { font-size: .76rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--nk-text-2); margin: 0 0 8px; display: flex; gap: 6px; align-items: center; }
    .vr-live { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .vr-box { background: var(--nk-surface); border: 1px solid var(--nk-border); border-radius: var(--nk-radius-sm); padding: 12px 14px; min-width: 0; }
    .vr-box .bx-l { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--nk-muted); display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .vr-box .bx-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .vr-box .bx-s { font-size: .84rem; color: var(--nk-text-2); margin-top: 8px; overflow-wrap: anywhere; }
    .vr-card { background: var(--nk-surface); border: 1px solid var(--nk-border); border-radius: var(--nk-radius-sm); padding: 14px 16px; }
    .vr-card .mono { font-size: .88rem; }
    .vr-amount { font-size: 1.15rem; font-weight: 800; color: var(--nk-navy); font-variant-numeric: tabular-nums; }
    .vr-flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .vr-flags li { display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; }
    .vr-flags .badge { flex: none; }
    .vr-foot { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
    .vr-foot .muted { margin-left: auto; font-size: .8rem; }
    .verify-result .alert { margin-top: 16px; }
    .verify-result .compare-table { background: var(--nk-surface); }

    /* how it works */
    .vf-how { margin-top: 36px; }
    .vf-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; counter-reset: step; }
    .vf-step { position: relative; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .vf-step .num { position: absolute; top: 16px; right: 18px; font-size: 2.4rem; font-weight: 800; line-height: 1; color: var(--nk-primary-100); }
    .vf-step h3 { margin: 4px 0 0; font-size: 1.02rem; }
    .vf-step p { margin: 0; color: var(--nk-text-2); font-size: .9rem; }
    .vf-step:not(:last-child)::after { content: ""; position: absolute; right: -17px; top: 50%; width: 12px; height: 12px; border-top: 3px solid var(--nk-primary-100); border-right: 3px solid var(--nk-primary-100); transform: translateY(-50%) rotate(45deg); }
    .vf-noc { margin-top: 14px; }
    .vf-keys { margin-top: 28px; }
    .vf-keys .mono { font-size: .84rem; }
    @media (max-width: 900px) {
      .vf-grid { grid-template-columns: minmax(0, 1fr); }
      .vf-steps { grid-template-columns: minmax(0, 1fr); }
      .vf-step:not(:last-child)::after { right: 50%; top: auto; bottom: -17px; transform: translateX(50%) rotate(135deg); }
    }
    @media (max-width: 640px) {
      .vr-live { grid-template-columns: minmax(0, 1fr); }
      .vf-tool .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .verify-result { padding: 16px; }
      .verify-result .dl { grid-template-columns: minmax(0, 1fr); }
      .vf-placeholder { padding: 18px; }
      .vf-cam .frame { inset: 14% 12%; }
    }
    @media print {
      .vf-tool, .vf-how, .vf-keys, .vr-foot { display: none !important; }
      .vf-grid { display: block; }
    }
  </style>
</head>
<body data-page="verify">
  <header id="nk-header"></header>
  <div id="nk-pagehead"></div>
  <main id="main" class="nk-main">
    <div class="nk-container">
      <div class="vf-grid">
        <section class="card vf-tool" aria-labelledby="tool-title">
          <div class="card-head">
            <h3 id="tool-title"><span data-ic="shield-check"></span> <span data-i18n="vfy.tool_title">Check a document</span></h3>
            <span class="sub" data-i18n="vfy.tool_sub">No sign-in needed</span>
          </div>
          <div class="card-body" id="tool"></div>
        </section>
        <section id="result" aria-live="polite" aria-label="Verification result" data-i18n-aria="vfy.result_aria"></section>
      </div>

      <section class="vf-how" aria-labelledby="how-title">
        <div class="section-title">
          <div>
            <div class="eyebrow" data-i18n="vfy.how_eyebrow">Behind the tick</div>
            <h2 id="how-title" data-i18n="vfy.how_title">How verification works</h2>
          </div>
        </div>
        <ol class="vf-steps" id="how-steps"></ol>
        <div class="alert info vf-noc" id="noc-note"></div>
      </section>

      <section class="card vf-keys" aria-labelledby="keys-title">
        <div class="card-head">
          <div>
            <h3 id="keys-title"><span data-ic="key"></span> <span data-i18n="vfy.keys_title">Registered signing keys</span></h3>
            <div class="sub" data-i18n="vfy.keys_sub">Public keys the portal trusts. A code signed by any other key is rejected.</div>
          </div>
          <span class="badge b-slate" id="keys-count" hidden></span>
        </div>
        <div class="card-body flush" id="keys"></div>
      </section>
    </div>
  </main>
  <div id="nk-footer"></div>
  <script type="module" src="verify.js"></script>
</body>
</html>
